<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>App Open Counter</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <header>
    <h1>App Open Counter</h1>
  </header>

  <main>
    <table id="app-table">
      <thead>
        <tr>
          <th>App</th>
          <th>Opens</th>
          <th>Time</th>
        </tr>
      </thead>
      <tbody id="app-list">
        <!-- rows inserted by popup.js -->
      </tbody>
    </table>
  </main>

  <section id="yt-section">
    <div id="yt-header">▶ YouTube Player</div>
    <div id="yt-controls">
      <input type="text" id="yt-input" placeholder="Paste YouTube URL or video ID" />
      <button id="yt-load-btn">Load</button>
    </div>
    <div id="yt-player-wrap">
      <iframe id="yt-frame"
        src=""
        allow="encrypted-media"
        allowfullscreen>
      </iframe>
    </div>
  </section>

  <footer>
    <button id="reset-btn">Reset all counts</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
